<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title> </title><link rel="stylesheet" href="style.css"></head><body><main class="playground"><canvas id="scene" aria-label="Mystery balloon. Tap to reveal your monster."></canvas><button id="tapTarget" aria-label="Build your monster"></button><div class="top-controls"><button id="gallery">Gallery <span>52</span></button><button id="sound" aria-label="Mute sound" aria-pressed="true">♪</button></div><div id="blast" aria-hidden="true"></div><div id="error" hidden>These balloons need WebGL.</div><div class="bottom"><p id="hint">Tap to wake it up.</p><div id="progress"><span></span></div><span id="stepLabel"></span><div class="monster-tools" id="monsterTools" hidden><button id="zoomOut" aria-label="Zoom out">−</button><button id="zoomIn" aria-label="Zoom in">+</button><button id="dance" aria-label="Change dance">Dance ↗</button><button id="stopDance" aria-label="Stop dancing" hidden>Stop</button></div><span id="danceLabel" hidden></span><div class="finish-actions"><button id="finish" hidden>Name & save photo ↗</button><button id="again" hidden>New maker ↗</button></div></div></main>
<dialog id="galleryDialog"><div class="dialog-heading"><h2>Beautiful mistakes.</h2><button class="close" aria-label="Close gallery">×</button></div><div class="tabs" role="tablist" aria-label="Gallery view"><button id="catalogTab" role="tab" aria-selected="true">All 52</button><button id="peopleTab" role="tab" aria-selected="false">Everyone’s monsters</button></div><div id="galleryGrid" class="gallery-grid"></div></dialog>
<dialog id="saveDialog"><div class="dialog-heading"><h2>You made this.</h2><button class="close" aria-label="Close portrait">×</button></div><p class="dialog-copy">Give your monster a maker.</p><form id="saveForm"><label for="makerName">Your name</label><input id="makerName" name="name" maxlength="40" required autocomplete="given-name" placeholder="Your name"><button id="savePhoto" type="submit">Save photo to Desktop ↗</button></form><p id="saveStatus" role="status"></p><button id="fallbackDownload" hidden>Download PNG ↗</button></dialog><div id="announcement" role="status" aria-live="polite"></div><script type="module" src="app.js"></script></body></html>
